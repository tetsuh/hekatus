[project]
name = "hekatus"
version = "0.0.1"
description = "A real-time ultrasound compute stack (enodia reference implementation)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.scripts]
enodia-demo = "enodia.demo:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enodia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
