name: keyword-guard

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every unlisted scope becomes `none`. Neither job writes
# to the repository, and neither needs the token after checkout.
permissions:
  contents: read

jobs:
  keyword-guard:
    runs-on: ubuntu-latest
    steps:
      # A fork pull request receives no repository secret, so the guard
      # cannot scan it. Fail loudly instead of passing unscanned. Reading a
      # contributor-controlled tree with `pull_request_target` — the usual
      # way to obtain the secret here — would expose a write-scoped token to
      # that tree, which is not a trade this repository accepts.
      - name: Reject unscannable fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot be scanned by the keyword guard."
          echo "Re-run the branch from a branch in this repository before merging."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Do not leave the token in the checked-out tree's git config.
          persist-credentials: false

      # Scans all tracked files (contents and paths) for prohibited words.
      # The word list comes from the KEYWORD_GUARD_WORDS secret
      # (comma-separated, matched case-insensitively on word boundaries)
      # and is never stored in this repository.
      #
      # Reporting never discloses the prohibited text itself: after a valid
      # list is parsed, every reporter message is masked, while contents hits
      # report the file and an occurrence count and paths are locatable.
      - name: Scan tracked files for prohibited words
        env:
          WORDS: ${{ secrets.KEYWORD_GUARD_WORDS }}
        run: |
          # GitHub's default bash -e shell does not enable pipefail. Set it
          # explicitly so mask_text's grep/sed pipeline returns grep's no-match
          # status instead of sed's success, allowing its loop to terminate.
          set -o pipefail

          # Issue #190: production archives have 16 members and ~64 MiB each.
          # Leave headroom, but bound headers (including PAX/GNU metadata), each
          # member, total payload, and the entire expanded tar stream against bombs.
          MAX_ARCHIVE_MEMBERS=256
          MAX_ARCHIVE_MEMBER_BYTES=134217728
          MAX_ARCHIVE_TOTAL_BYTES=268435456
          MAX_ARCHIVE_STREAM_BYTES=285212672
          export MAX_ARCHIVE_MEMBERS MAX_ARCHIVE_MEMBER_BYTES
          export MAX_ARCHIVE_TOTAL_BYTES MAX_ARCHIVE_STREAM_BYTES

          if [ -z "$WORDS" ]; then
            echo "::error::KEYWORD_GUARD_WORDS repository secret is not set; configure it before merging."
            exit 1
          fi

          words=()
          IFS=',' read -ra raw <<< "$WORDS"
          for w in "${raw[@]}"; do
            # Perl's Unicode White_Space property covers non-ASCII separators
            # that the locale-dependent tr [:space:] class can leave behind.
            w="$(printf '%s' "$w" | perl -CSD -pe 's/\p{White_Space}//g')"
            [ -n "$w" ] && words+=("$w")
          done
          if [ "${#words[@]}" -eq 0 ]; then
            echo "::error::KEYWORD_GUARD_WORDS word list is empty after parsing; set the repository secret to a comma-separated list before merging."
            exit 1
          fi

          # GNU grep is the source of truth for case equivalence. Use the
          # same locale and literal fixed-string matching for detection and
          # masking, including Unicode equivalents such as final sigma and
          # long s. Never use Bash lowercasing here: it does not implement
          # grep's complete case mapping.
          export LC_ALL=C.UTF-8
          mask_text() {
            local text="$1" w match prefix output rest replacement=' '
            for w in "${words[@]}"; do
              output=""
              rest="$text"
              # The parser above removes every [:space:] byte before accepting
              # a term. A whitespace replacement is therefore not itself an
              # accepted term and cannot join terms across its boundaries.
              # grep -o may emit every match on one input line; sed selects
              # exactly one match so each iteration consumes actual input.
              while match=$(printf '%s' "$rest" | grep -oaiF -- "$w" | sed -n '1p'); do
                prefix="${rest%%"$match"*}"
                output+="${prefix}${replacement}"
                rest="${rest#*"$match"}"
              done
              text="$output$rest"
            done
            printf '%s' "$text"
          }

          mask_path() {
            mask_text "$1"
          }

          sanitize_diagnostic() {
            local text="$1"
            # GitHub decodes percent-encoded newlines and carriage returns in
            # workflow commands. Replace those bytes, plus command delimiters,
            # with spaces after masking so attacker-controlled paths remain a
            # single inert line without introducing a new configured term.
            text="${text//$'\r'/ }"
            text="${text//$'\n'/ }"
            text="${text//%/ }"
            text="${text//::/  }"
            printf '%s' "$text"
          }

          annotation_path_is_safe() {
            local path="$1"
            # A path is a workflow-command property only when it cannot add a
            # property, terminate the property list, or encode a new line.
            case "$path" in
              *[,=%$'\r'$'\n']*|*::*|*=*) return 1 ;;
              *) return 0 ;;
            esac
          }

          diagnostic_is_safe() {
            local text="$1"
            case "$text" in
              *[,=%$'\r'$'\n']*|*::*) return 1 ;;
              *) return 0 ;;
            esac
          }

          skeleton_is_safe() {
            local skeleton="$1" w
            for w in "${words[@]}"; do
              # Match each configured term against the actual unmasked
              # skeleton, literally and case-insensitively. Whole-word
              # matching would miss substrings such as "err" and ":".
              if printf '%s' "$skeleton" | grep -qaiF -- "$w"; then
                return 1
              fi
            done
            return 0
          }

          contains_configured_term() {
            local text="$1" w
            for w in "${words[@]}"; do
              if printf '%s' "$text" | grep -qaiF -- "$w"; then
                return 0
              fi
            done
            return 1
          }

          report() {
            local annotation_path="$1" message="$2" human masked_raw masked masked_path masked_message skeleton candidate human_is_safe
            if [ -n "$annotation_path" ]; then
              human="$annotation_path: $message"
            else
              human="$message"
            fi
            # Mask every human-readable component before applying the
            # rendering safety transformation, preserving the #69 discipline.
            masked_raw=$(mask_text "$human")
            masked=$(sanitize_diagnostic "$masked_raw")
            skeleton='::error file=::'

            # Check both the original and masked diagnostics. Masking can
            # remove a control byte when a configured term spans it, so the
            # original text must also force the inert plain rendering.
            if diagnostic_is_safe "$human" &&
              diagnostic_is_safe "$annotation_path" &&
              diagnostic_is_safe "$masked_raw"; then
              human_is_safe=1
            else
              human_is_safe=0
            fi
            if [ -n "$annotation_path" ]; then
              masked_path=$(mask_text "$annotation_path")
              masked_message=$(mask_text "$message")
              if ! annotation_path_is_safe "$masked_path"; then
                printf '%s\n' "$masked"
                return
              fi
              masked_path=$(sanitize_diagnostic "$masked_path")
              masked_message=$(sanitize_diagnostic "$masked_message")
            fi

            # Only the workflow-command skeleton bypasses masking. Assemble
            # the exact rendered command before checking it, so a configured
            # term cannot cross from the skeleton into a masked component (or
            # between any other rendered boundaries).
            if [ "$human_is_safe" -eq 0 ] || ! skeleton_is_safe "$skeleton"; then
              printf '%s\n' "$masked"
            elif [ -n "$annotation_path" ]; then
              candidate=$(printf '::error file=%s::%s' "$masked_path" "$masked_message")
              if contains_configured_term "$candidate"; then
                printf '%s\n' "$masked"
              else
                printf '%s\n' "$candidate"
              fi
            else
              candidate=$(printf '::error::%s' "$masked")
              if contains_configured_term "$candidate"; then
                printf '%s\n' "$masked"
              else
                printf '%s\n' "$candidate"
              fi
            fi
          }

          report_plain() {
            local masked
            masked=$(mask_text "$1")
            masked=$(sanitize_diagnostic "$masked")
            printf '%s\n' "$masked"
          }

          fail=0
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          tracked_file="$scan_dir/tracked"
          if ! git ls-files -z >"$tracked_file" 2>/dev/null; then
            report "" "keyword guard: unable to enumerate tracked files"
            exit 1
          fi

          # Python's standard library exposes tar metadata without extraction;
          # shell tar listings cannot safely delimit arbitrary member names.
          # Supported: .tar.gz / .tgz / .tar, also recognized by gzip/tar magic.
          # Other known archive extensions/magic fail closed, including standalone
          # gzip, zip, xz, bzip2, zstd, 7z and rar. Nested archives fail closed:
          # no recursion means one resource budget and no opaque binary bypass.
          # Each archive is expanded once into bounded memory. Physical tar
          # framing is checked independently before tarfile interprets members;
          # members go to GNU grep with the tracked-file locale/options.
          # Without a known suffix or strong signature, unknown formats retain
          # the original ordinary-byte scan (possibly scanning compressed bytes).
          # No member is written to disk and no archive-provided path is opened.
          # Region policy: member/metadata padding, reserved header bytes and
          # string tails must be zero; end records must be complete and zero.
          # Physical names and every PAX/GNU path value are scanned, even when
          # later overwritten. GNU path terminators/tails are validated.
          # Container-only fields are intentionally NOT keyword-scanned: gzip
          # filename/comment/extra (required by #190's container-only-hit AC),
          # tar permissions/IDs/times/owner/group and non-path PAX auxiliary
          # keys/values (format/filesystem metadata, not regular file contents).
          # Fixed tar fields and PAX record framing are validated; PAX size is
          # enforced and sparse metadata rejected. zlib validates gzip header CRC when
          # present and trailer CRC/ISIZE; extra streams/trailing bytes fail.
          # Known limit (#190): text inside a NUL-containing member is NOT detected.
          printf '%s\0' "${words[@]}" >"$scan_dir/words"
          cat >"$scan_dir/archive.py" <<'PY'
          import io
          import os
          import re
          import subprocess
          import sys
          import tarfile
          import zlib

          MAX_HEADERS = int(os.environ["MAX_ARCHIVE_MEMBERS"])
          MAX_MEMBER = int(os.environ["MAX_ARCHIVE_MEMBER_BYTES"])
          MAX_TOTAL = int(os.environ["MAX_ARCHIVE_TOTAL_BYTES"])
          MAX_STREAM = int(os.environ["MAX_ARCHIVE_STREAM_BYTES"])
          SUPPORTED = (".tar.gz", ".tgz", ".tar")
          UNSUPPORTED = (
              ".zip", ".gz", ".xz", ".bz2", ".zst", ".zstd", ".7z", ".rar",
              ".tbz", ".tbz2", ".txz", ".tzst", ".jar", ".war", ".whl",
              ".egg", ".lz", ".lzma", ".lzo", ".lz4", ".br", ".cab", ".iso",
              ".ar", ".a", ".deb", ".rpm", ".cpio", ".Z",
          )

          class Rejected(Exception):
              pass

          def event(kind, name="", detail=""):
              for field in (kind, name, str(detail)):
                  sys.stdout.buffer.write(os.fsencode(field) + b"\0")

          def reject(name, reason):
              event("error", name, reason)
              raise Rejected

          def suffix(name):
              name = name.lower()
              if name.endswith(SUPPORTED):
                  return "tar"
              if name.endswith(tuple(ext.lower() for ext in UNSUPPORTED)):
                  return "unsupported"
              return ""

          def magic(data):
              if (len(data) >= 10 and data.startswith(b"\x1f\x8b\x08") and
                      not data[3] & 0xe0):
                  return "gzip"
              if data.startswith((b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08",
                                  b"\xfd7zXZ\0", b"\x28\xb5\x2f\xfd",
                                  b"7z\xbc\xaf\x27\x1c", b"Rar!\x1a\x07\x00",
                                  b"Rar!\x1a\x07\x01\x00", b"\x04\x22\x4d\x18",
                                  b"!<arch>\n", b"MSCF\0\0\0\0", b"\xed\xab\xee\xdb")):
                  return "unsupported"
              # Text-like prefixes alone are not archive signatures. Require
              # bzip2's block/end marker, or cpio's first fixed-width hex field.
              if re.match(rb"BZh[1-9](1AY&SY|\x17rE8P\x90)|07070[12][0-9A-Fa-f]{8}", data):
                  return "unsupported"
              if len(data) >= 512 and any(data[:512]):
                  try:
                      tarfile.TarInfo.frombuf(data[:512], "utf-8", "surrogateescape")
                      return "tar"
                  except tarfile.HeaderError:
                      pass
              return ""

          def expand_tar(raw, compressed):
              expanded = io.BytesIO()
              remaining = MAX_STREAM
              decoder = zlib.decompressobj(16 + zlib.MAX_WBITS) if compressed else None
              pending = b""
              while True:
                  limit = min(65536, remaining + 1)
                  if decoder is None:
                      chunk = raw.read(limit)
                      if not chunk:
                          return expanded
                  else:
                      supplied = pending or raw.read(65536)
                      try:
                          chunk = decoder.decompress(supplied, limit)
                      except zlib.error:
                          reject("", "unreadable or invalid archive gzip envelope")
                      pending = decoder.unconsumed_tail
                  remaining -= len(chunk)
                  if remaining < 0:
                      raise ValueError("expanded stream limit")
                  expanded.write(chunk)
                  if decoder is not None:
                      if decoder.eof:
                          if decoder.unused_data or pending or raw.read(1):
                              reject("", "unreadable or invalid archive: trailing gzip data")
                          return expanded
                      if not supplied and not chunk:
                          reject("", "unreadable or invalid archive gzip envelope")

          def check_header_fields(block):
              def invalid():
                  reject("", "unreadable or invalid archive header field")

              def text(start, end):
                  value = block[start:end]
                  nul = value.find(b"\0")
                  if nul >= 0 and any(value[nul:]):
                      invalid()

              def number(start, end, binary=True):
                  value = block[start:end]
                  if binary and value[0] in (0x80, 0xff):
                      return  # GNU base-256: every byte belongs to the number.
                  head, _, tail = value.partition(b"\0")
                  if any(c not in b"\0 " for c in tail):
                      invalid()
                  if any(c not in b"01234567" for c in head.strip(b" ")):
                      invalid()

              text(0, 100)
              # All actual links are refused before this check. The link field
              # on accepted physical records has no use and must be empty.
              if any(block[157:257]):
                  invalid()
              for start, end in ((100, 108), (108, 116), (116, 124), (124, 136), (136, 148)):
                  number(start, end)
              number(148, 156, binary=False)
              layout = block[257:265]
              if layout == b"\0" * 8:  # V7: everything after linkname is spare.
                  if any(block[257:]):
                      invalid()
                  return
              if layout not in (tarfile.POSIX_MAGIC, tarfile.GNU_MAGIC):
                  invalid()
              text(265, 297)
              text(297, 329)
              number(329, 337)
              number(337, 345)
              if layout == tarfile.POSIX_MAGIC:
                  text(345, 500)
                  if any(block[500:]):
                      invalid()
              else:
                  number(345, 357)  # GNU atime/ctime are format metadata.
                  number(357, 369)
                  if any(block[369:]):  # Sparse/multivolume types are refused.
                      invalid()

          def pax_size_fields(payload, words):
              # Size affects framing. Scan every path value, not just the final
              # value tarfile retains; other values are auxiliary format metadata.
              # Validate every length-delimited record before interpretation.
              fields = {}
              pos = 0
              while pos < len(payload):
                  if payload[pos] == 0:
                      if any(payload[pos:]):
                          raise ValueError("invalid PAX padding")
                      break
                  space = payload.find(b" ", pos)
                  if space < 0 or not payload[pos:space].isdigit():
                      raise ValueError("invalid PAX length")
                  length = int(payload[pos:space])
                  end = pos + length
                  if length < 5 or end > len(payload) or end <= space + 1 or payload[end - 1] != 10:
                      raise ValueError("invalid PAX record")
                  key, equals, value = payload[space + 1:end - 1].partition(b"=")
                  if not key or not equals:
                      raise ValueError("invalid PAX field")
                  if key.startswith(b"GNU.sparse."):
                      reject("", "unsupported member type")
                  if key == b"path" or (key == b"linkpath" and value):
                      scan_member_path(os.fsdecode(value), words)
                  if key == b"size":
                      if not value.isdigit():
                          raise ValueError("invalid PAX size")
                      fields[key] = int(value)
                  pos = end
              return fields

          def check_tar(data, words):
              # Walk physical 512-byte headers and padded payloads independently
              # of tarfile's internal parser dispatch (which changed in 3.14).
              # The public stateless header parser checks each checksum. Bounds
              # and forbidden types are checked here AND on logical members.
              metadata = (tarfile.XHDTYPE, tarfile.XGLTYPE, tarfile.SOLARIS_XHDTYPE,
                          tarfile.GNUTYPE_LONGNAME, tarfile.GNUTYPE_LONGLINK)
              allowed = (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE)
              pos = headers = total = 0
              global_fields, local_fields = {}, {}
              pending_metadata = False
              expected = []
              while pos + 512 <= len(data):
                  block = data[pos:pos + 512].tobytes()
                  if block == b"\0" * 512:
                      if (pending_metadata or len(data) - pos < 1024 or
                              len(data) % 512 or any(data[pos:])):
                          reject("", "unreadable or invalid archive end records")
                      return expected
                  headers += 1
                  if headers > MAX_HEADERS:
                      reject("", "member count limit exceeded")
                  header = tarfile.TarInfo.frombuf(block, "utf-8", "surrogateescape")
                  if header.type not in allowed + metadata:
                      reject(header.name, "unsupported member type")
                  check_header_fields(block)
                  scan_member_path(header.name, words)
                  if header.size < 0 or header.size > MAX_MEMBER:
                      reject(header.name, "member size limit exceeded")
                  start = pos + 512
                  if header.type in metadata:
                      size = header.size
                      payload = data[start:start + size].tobytes()
                      if len(payload) != size:
                          raise ValueError("truncated metadata")
                      if header.type in (tarfile.XHDTYPE, tarfile.XGLTYPE, tarfile.SOLARIS_XHDTYPE):
                          fields = pax_size_fields(payload, words)
                          if header.type == tarfile.XGLTYPE:
                              global_fields.update(fields)
                          else:
                              # Outer (earlier) local PAX records take precedence
                              # when metadata headers chain through tarfile.
                              local_fields = {**fields, **local_fields}
                      else:
                          path, terminator, tail = payload.partition(b"\0")
                          if not terminator or any(tail):
                              reject("", "unreadable or invalid GNU path metadata")
                          if path or header.type == tarfile.GNUTYPE_LONGNAME:
                              scan_member_path(os.fsdecode(path), words)
                      pending_metadata = True
                  else:
                      size = local_fields.get(b"size", global_fields.get(b"size", header.size))
                      if size < 0 or size > MAX_MEMBER:
                          reject(header.name, "member size limit exceeded")
                      total += size
                      if total > MAX_TOTAL:
                          reject(header.name, "total size limit exceeded")
                      if header.isdir() and size:
                          reject(header.name, "invalid directory payload")
                      expected.append((size, start))
                      local_fields = {}
                      pending_metadata = False
                  pos = start + ((size + 511) // 512) * 512
                  if pos > len(data):
                      raise ValueError("truncated tar payload")
                  if any(data[start + size:pos]):
                      reject("", "unreadable or invalid archive: nonzero padding")
              raise ValueError("missing tar end blocks")

          def scan_terms(data, kind, name, words):
              options = "-oaiwF" if kind == "contents" else "-oiwF"
              for word in words:
                  result = subprocess.run(
                      [b"grep", options.encode(), b"--", word], input=data,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  )
                  if result.returncode not in (0, 1):
                      reject(name, "unable to scan archive member")
                  if result.returncode == 0:
                      event(kind, name, result.stdout.count(b"\n"))

          def scan_member_path(name, words):
              if "\0" in name:
                  reject("", "unsafe member path")
              scan_terms(os.fsencode(name), "path", name, words)
              parts = name.replace("\\", "/").split("/")
              if (not name or name.startswith(("/", "\\")) or
                      ".." in parts or re.match(r"^[A-Za-z]:", name)):
                  reject(name, "unsafe member path")

          def scan(path, words):
              hint = suffix(path)
              try:
                  raw = open(path, "rb")
              except OSError:
                  if not hint:
                      return 3  # Preserve ordinary unreadable-file diagnostics.
                  raise
              with raw:
                  signature = magic(raw.read(512))
                  raw.seek(0)
                  if hint == "unsupported" or signature == "unsupported":
                      reject("", "unsupported archive format")
                  if not hint and not signature:
                      return 3  # Ordinary tracked files keep the shell scanner.
                  if signature not in ("gzip", "tar") and hint != "tar":
                      reject("", "unsupported archive format")
                  expanded = expand_tar(raw, signature == "gzip")
                  with expanded.getbuffer() as data:
                      expected = check_tar(data, words)
                  expanded.seek(0)
                  total = scanned = skipped = seen = 0
                  with tarfile.open(fileobj=expanded, mode="r:") as archive:
                      for member in archive:
                          name = member.name
                          # PAX can encode NUL even though filesystem paths cannot.
                          # Reject before using our NUL-delimited event protocol.
                          if "\0" in name:
                              reject("", "unsafe member path")
                          if seen >= len(expected) or (member.size, member.offset_data) != expected[seen]:
                              reject(name, "archive parser/framing disagreement")
                          seen += 1
                          scan_member_path(name, words)
                          if (member.type not in (tarfile.REGTYPE, tarfile.AREGTYPE,
                                                  tarfile.DIRTYPE) or member.sparse is not None):
                              reject(name, "unsupported member type")
                          if member.size < 0 or member.size > MAX_MEMBER:
                              reject(name, "member size limit exceeded")
                          total += member.size
                          if total > MAX_TOTAL:
                              reject(name, "total size limit exceeded")
                          if member.isdir():
                              if member.size:
                                  reject(name, "invalid directory payload")
                              continue
                          with archive.extractfile(member) as stream:
                              data = stream.read(MAX_MEMBER + 1)
                          if len(data) != member.size:
                              reject(name, "unreadable or invalid archive member")
                          if suffix(name) or magic(data[:512]):
                              reject(name, "nested archive is not supported")
                          if b"\0" in data:
                              event("skip", name)
                              skipped += 1
                          else:
                              scan_terms(data, "contents", name, words)
                              scanned += 1
                      if seen != len(expected):
                          reject("", "archive parser/framing disagreement")
                  event("summary", str(scanned), skipped)
              return 0

          try:
              with open(sys.argv[2], "rb") as word_file:
                  words = word_file.read().split(b"\0")[:-1]
              status = scan(sys.argv[1], words)
          except Rejected:
              status = 1
          except Exception:
              # Never emit exception text: it can include unmasked paths/data.
              event("error", "", "unreadable or invalid archive")
              status = 1
          sys.exit(status)
          PY

          while IFS= read -r -d '' f; do
            archive_status=0
            python3 "$scan_dir/archive.py" "$f" "$scan_dir/words" >"$scan_dir/events" 2>/dev/null || archive_status=$?
            if [ "$archive_status" -ne 0 ] && [ "$archive_status" -ne 3 ]; then
              report "" "keyword guard: unable to scan archive or tracked contents of $f"
              fail=1
            fi
            while IFS= read -r -d '' kind && IFS= read -r -d '' member && IFS= read -r -d '' detail; do
              case "$kind" in
                contents|path)
                  report "" "$f: $member: prohibited word in archive member $kind ($detail occurrence(s))"
                  fail=1 ;;
                skip)
                  report_plain "keyword guard: $f: $member: skipped binary member" ;;
                error)
                  report "" "keyword guard: $f: $member: $detail"
                  fail=1 ;;
                summary)
                  report_plain "keyword guard: archive $f: scanned $member text member(s); skipped $detail binary member(s)" ;;
                *)
                  report "" "keyword guard: invalid archive scan result"
                  fail=1 ;;
              esac
            done <"$scan_dir/events"
            safe=$(mask_path "$f")
            for w in "${words[@]}"; do
              # -a: scan binary contents as text; -w: word boundaries;
              # -F: literal; -i: case-insensitive. grep status 1 means
              # ordinary no-match; every other failure is a scan failure.
              matches_file="$scan_dir/matches"
              hits=0
              if [ "$archive_status" -eq 3 ]; then
                if grep -oaiwF -- "$w" "$f" >"$matches_file" 2>/dev/null; then
                  hits=$(wc -l <"$matches_file")
                else
                  grep_status=$?
                  if [ "$grep_status" -ne 1 ]; then
                    report "" "keyword guard: unable to scan tracked contents"
                    fail=1
                  fi
                fi
                if [ "$hits" -gt 0 ]; then
                  if [ "$safe" = "$f" ]; then
                    report "$f" "prohibited word in contents ($hits occurrence(s))"
                  else
                    report "" "prohibited word in contents of $f ($hits occurrence(s))"
                  fi
                  fail=1
                fi
              fi

              path_file="$scan_dir/path"
              printf '%s' "$f" >"$path_file"
              if grep -oiwF -- "$w" "$path_file" >"$matches_file" 2>/dev/null; then
                phits=$(wc -l <"$matches_file")
              else
                grep_status=$?
                if [ "$grep_status" -eq 1 ]; then
                  phits=0
                else
                  report "" "keyword guard: unable to scan tracked path"
                  fail=1
                  phits=0
                fi
              fi
              if [ "$phits" -gt 0 ]; then
                report "" "prohibited word in path $f ($phits occurrence(s))"
                fail=1
              fi
            done
          done <"$tracked_file"

          if [ "$fail" -eq 0 ]; then
            report_plain "keyword guard: clean"
          fi
          exit $fail
