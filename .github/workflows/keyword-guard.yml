name: keyword-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  keyword-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans all tracked files (contents and paths) for prohibited words.
      # The word list comes from the KEYWORD_GUARD_WORDS secret
      # (comma-separated, matched case-insensitively on word boundaries)
      # and is never stored in this repository.
      #
      # Reporting never discloses the prohibited text itself: contents hits
      # report the file and an occurrence count, and paths that contain a
      # prohibited word are printed with the word masked.
      - name: Scan tracked files for prohibited words
        env:
          WORDS: ${{ secrets.KEYWORD_GUARD_WORDS }}
        run: |
          if [ -z "$WORDS" ]; then
            echo "::warning::KEYWORD_GUARD_WORDS secret is not set; guard skipped."
            exit 0
          fi

          words=()
          IFS=',' read -ra raw <<< "$WORDS"
          for w in "${raw[@]}"; do
            w="$(printf '%s' "$w" | tr -d '[:space:]')"
            [ -n "$w" ] && words+=("$w")
          done
          if [ "${#words[@]}" -eq 0 ]; then
            echo "::warning::KEYWORD_GUARD_WORDS is empty; guard skipped."
            exit 0
          fi

          # Replace every prohibited word in a path with *** so that a
          # violating path can be located without republishing the word.
          mask_path() {
            local p="$1" w esc
            for w in "${words[@]}"; do
              esc=$(printf '%s' "$w" | sed 's/[][\.*^$\/&]/\\&/g')
              p=$(printf '%s' "$p" | sed -E "s/$esc/***/Ig")
            done
            printf '%s' "$p"
          }

          fail=0
          while IFS= read -r -d '' f; do
            safe=$(mask_path "$f")
            for w in "${words[@]}"; do
              # -a: scan binary contents as text; -w: word boundaries;
              # -F: literal; -i: case-insensitive.
              hits=$(grep -oaiwF -- "$w" "$f" 2>/dev/null | wc -l)
              if [ "$hits" -gt 0 ]; then
                if [ "$safe" = "$f" ]; then
                  echo "::error file=$f::prohibited word in contents ($hits occurrence(s))"
                else
                  echo "::error::prohibited word in contents of $safe ($hits occurrence(s))"
                fi
                fail=1
              fi
              phits=$(printf '%s' "$f" | grep -oiwF -- "$w" | wc -l)
              if [ "$phits" -gt 0 ]; then
                echo "::error::prohibited word in path $safe ($phits occurrence(s))"
                fail=1
              fi
            done
          done < <(git ls-files -z)

          if [ "$fail" -eq 0 ]; then
            echo "keyword guard: clean"
          fi
          exit $fail
