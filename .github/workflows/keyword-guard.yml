name: keyword-guard

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every unlisted scope becomes `none`. Neither job writes
# to the repository, and neither needs the token after checkout.
permissions:
  contents: read

jobs:
  keyword-guard:
    runs-on: ubuntu-latest
    steps:
      # A fork pull request receives no repository secret, so the guard
      # cannot scan it. Fail loudly instead of passing unscanned. Reading a
      # contributor-controlled tree with `pull_request_target` — the usual
      # way to obtain the secret here — would expose a write-scoped token to
      # that tree, which is not a trade this repository accepts.
      - name: Reject unscannable fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot be scanned by the keyword guard."
          echo "Re-run the branch from a branch in this repository before merging."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Do not leave the token in the checked-out tree's git config.
          persist-credentials: false

      # Scans all tracked files (contents and paths) for prohibited words.
      # The word list comes from the KEYWORD_GUARD_WORDS secret
      # (comma-separated, matched case-insensitively on word boundaries)
      # and is never stored in this repository.
      #
      # Reporting never discloses the prohibited text itself: after a valid
      # list is parsed, every reporter message is masked, while contents hits
      # report the file and an occurrence count and paths are locatable.
      - name: Scan tracked files for prohibited words
        env:
          WORDS: ${{ secrets.KEYWORD_GUARD_WORDS }}
        run: |
          # GitHub's default bash -e shell does not enable pipefail. Set it
          # explicitly so mask_text's grep/sed pipeline returns grep's no-match
          # status instead of sed's success, allowing its loop to terminate.
          set -o pipefail

          # Issue #190: production archives have 16 members and ~64 MiB each.
          # Leave headroom, but bound regular members, each payload, total payload,
          # and the entire expanded stream against bombs. Other record types fail.
          MAX_ARCHIVE_MEMBERS=256
          MAX_ARCHIVE_MEMBER_BYTES=134217728
          MAX_ARCHIVE_TOTAL_BYTES=268435456
          MAX_ARCHIVE_STREAM_BYTES=285212672
          export MAX_ARCHIVE_MEMBERS MAX_ARCHIVE_MEMBER_BYTES
          export MAX_ARCHIVE_TOTAL_BYTES MAX_ARCHIVE_STREAM_BYTES

          if [ -z "$WORDS" ]; then
            echo "::error::KEYWORD_GUARD_WORDS repository secret is not set; configure it before merging."
            exit 1
          fi

          words=()
          IFS=',' read -ra raw <<< "$WORDS"
          for w in "${raw[@]}"; do
            # Perl's Unicode White_Space property covers non-ASCII separators
            # that the locale-dependent tr [:space:] class can leave behind.
            w="$(printf '%s' "$w" | perl -CSD -pe 's/\p{White_Space}//g')"
            [ -n "$w" ] && words+=("$w")
          done
          if [ "${#words[@]}" -eq 0 ]; then
            echo "::error::KEYWORD_GUARD_WORDS word list is empty after parsing; set the repository secret to a comma-separated list before merging."
            exit 1
          fi

          # GNU grep is the source of truth for case equivalence. Use the
          # same locale and literal fixed-string matching for detection and
          # masking, including Unicode equivalents such as final sigma and
          # long s. Never use Bash lowercasing here: it does not implement
          # grep's complete case mapping.
          export LC_ALL=C.UTF-8
          mask_text() {
            local text="$1" w match prefix output rest replacement=' '
            for w in "${words[@]}"; do
              output=""
              rest="$text"
              # The parser above removes every [:space:] byte before accepting
              # a term. A whitespace replacement is therefore not itself an
              # accepted term and cannot join terms across its boundaries.
              # grep -o may emit every match on one input line; sed selects
              # exactly one match so each iteration consumes actual input.
              while match=$(printf '%s' "$rest" | grep -oaiF -- "$w" | sed -n '1p'); do
                prefix="${rest%%"$match"*}"
                output+="${prefix}${replacement}"
                rest="${rest#*"$match"}"
              done
              text="$output$rest"
            done
            printf '%s' "$text"
          }

          mask_path() {
            mask_text "$1"
          }

          sanitize_diagnostic() {
            local text="$1"
            # GitHub decodes percent-encoded newlines and carriage returns in
            # workflow commands. Replace those bytes, plus command delimiters,
            # with spaces after masking so attacker-controlled paths remain a
            # single inert line without introducing a new configured term.
            text="${text//$'\r'/ }"
            text="${text//$'\n'/ }"
            text="${text//%/ }"
            text="${text//::/  }"
            printf '%s' "$text"
          }

          annotation_path_is_safe() {
            local path="$1"
            # A path is a workflow-command property only when it cannot add a
            # property, terminate the property list, or encode a new line.
            case "$path" in
              *[,=%$'\r'$'\n']*|*::*|*=*) return 1 ;;
              *) return 0 ;;
            esac
          }

          diagnostic_is_safe() {
            local text="$1"
            case "$text" in
              *[,=%$'\r'$'\n']*|*::*) return 1 ;;
              *) return 0 ;;
            esac
          }

          skeleton_is_safe() {
            local skeleton="$1" w
            for w in "${words[@]}"; do
              # Match each configured term against the actual unmasked
              # skeleton, literally and case-insensitively. Whole-word
              # matching would miss substrings such as "err" and ":".
              if printf '%s' "$skeleton" | grep -qaiF -- "$w"; then
                return 1
              fi
            done
            return 0
          }

          contains_configured_term() {
            local text="$1" w
            for w in "${words[@]}"; do
              if printf '%s' "$text" | grep -qaiF -- "$w"; then
                return 0
              fi
            done
            return 1
          }

          report() {
            local annotation_path="$1" message="$2" human masked_raw masked masked_path masked_message skeleton candidate human_is_safe
            if [ -n "$annotation_path" ]; then
              human="$annotation_path: $message"
            else
              human="$message"
            fi
            # Mask every human-readable component before applying the
            # rendering safety transformation, preserving the #69 discipline.
            masked_raw=$(mask_text "$human")
            masked=$(sanitize_diagnostic "$masked_raw")
            skeleton='::error file=::'

            # Check both the original and masked diagnostics. Masking can
            # remove a control byte when a configured term spans it, so the
            # original text must also force the inert plain rendering.
            if diagnostic_is_safe "$human" &&
              diagnostic_is_safe "$annotation_path" &&
              diagnostic_is_safe "$masked_raw"; then
              human_is_safe=1
            else
              human_is_safe=0
            fi
            if [ -n "$annotation_path" ]; then
              masked_path=$(mask_text "$annotation_path")
              masked_message=$(mask_text "$message")
              if ! annotation_path_is_safe "$masked_path"; then
                printf '%s\n' "$masked"
                return
              fi
              masked_path=$(sanitize_diagnostic "$masked_path")
              masked_message=$(sanitize_diagnostic "$masked_message")
            fi

            # Only the workflow-command skeleton bypasses masking. Assemble
            # the exact rendered command before checking it, so a configured
            # term cannot cross from the skeleton into a masked component (or
            # between any other rendered boundaries).
            if [ "$human_is_safe" -eq 0 ] || ! skeleton_is_safe "$skeleton"; then
              printf '%s\n' "$masked"
            elif [ -n "$annotation_path" ]; then
              candidate=$(printf '::error file=%s::%s' "$masked_path" "$masked_message")
              if contains_configured_term "$candidate"; then
                printf '%s\n' "$masked"
              else
                printf '%s\n' "$candidate"
              fi
            else
              candidate=$(printf '::error::%s' "$masked")
              if contains_configured_term "$candidate"; then
                printf '%s\n' "$masked"
              else
                printf '%s\n' "$candidate"
              fi
            fi
          }

          report_plain() {
            local masked
            masked=$(mask_text "$1")
            masked=$(sanitize_diagnostic "$masked")
            printf '%s\n' "$masked"
          }

          fail=0
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          tracked_file="$scan_dir/tracked"
          if ! git ls-files -z >"$tracked_file" 2>/dev/null; then
            report "" "keyword guard: unable to enumerate tracked files"
            exit 1
          fi

          # Narrow profile: one gzip stream containing POSIX ustar, typeflag '0'
          # only. PAX/GNU extensions, directories, legacy NUL typeflag, GNU/V7
          # layouts and base-256 numbers fail. Hierarchy needs no directory entry.
          # Typical suffixes: .tar.gz/.tgz; gzip magic handles renamed files.
          # Raw .tar and known unsupported formats fail, as do recognized nested
          # archives. Unknown suffix/signature formats retain the ordinary byte
          # scan, possibly of compressed bytes. Never silently add an exclusion.
          # Python/zlib bounds and checks gzip integrity (FHCRC when present and
          # CRC32/ISIZE), with no extra stream/tail. A fixed 512-byte header walk
          # needs no tarfile parser. Spare bytes/padding/end records must be zero.
          # Raw prefix/name bytes go to grep without normalization; no disk
          # extraction or archive-provided filesystem path is ever used.
          # Detection grep starts <= (2*M+1)*W for M members, W configured terms:
          # raw path + NUL-free contents + outer tracked path. No metadata loop.
          # Keep per-term calls: grep -f changes overlapping occurrence semantics.
          # Reporter masking is unchanged; member paths are at most 256 bytes.
          # Gzip filename/comment/extra and tar permissions/IDs/times/owner/group
          # are container/format metadata, not file contents: intentionally no
          # keyword scan there (the container-only-hit AC requires this).
          # Known limit (#190): text inside a NUL-containing member is NOT detected.
          printf '%s\0' "${words[@]}" >"$scan_dir/words"
          cat >"$scan_dir/archive.py" <<'PY'
          import io
          import os
          import re
          import subprocess
          import sys
          import zlib

          MAX_HEADERS = int(os.environ["MAX_ARCHIVE_MEMBERS"])
          MAX_MEMBER = int(os.environ["MAX_ARCHIVE_MEMBER_BYTES"])
          MAX_TOTAL = int(os.environ["MAX_ARCHIVE_TOTAL_BYTES"])
          MAX_STREAM = int(os.environ["MAX_ARCHIVE_STREAM_BYTES"])
          SUPPORTED = (".tar.gz", ".tgz", ".tar")
          UNSUPPORTED = (
              ".zip", ".gz", ".xz", ".bz2", ".zst", ".zstd", ".7z", ".rar",
              ".tbz", ".tbz2", ".txz", ".tzst", ".jar", ".war", ".whl",
              ".egg", ".lz", ".lzma", ".lzo", ".lz4", ".br", ".cab", ".iso",
              ".ar", ".a", ".deb", ".rpm", ".cpio", ".Z",
          )

          class Rejected(Exception):
              pass

          def event(kind, name="", detail=""):
              for field in (kind, name, str(detail)):
                  sys.stdout.buffer.write(os.fsencode(field) + b"\0")

          def reject(name, reason):
              event("error", name, reason)
              raise Rejected

          def suffix(name):
              name = name.lower()
              if name.endswith(SUPPORTED):
                  return "tar"
              if name.endswith(tuple(ext.lower() for ext in UNSUPPORTED)):
                  return "unsupported"
              return ""

          def magic(data):
              if (len(data) >= 10 and data.startswith(b"\x1f\x8b\x08") and
                      not data[3] & 0xe0):
                  return "gzip"
              if data.startswith((b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08",
                                  b"\xfd7zXZ\0", b"\x28\xb5\x2f\xfd",
                                  b"7z\xbc\xaf\x27\x1c", b"Rar!\x1a\x07\x00",
                                  b"Rar!\x1a\x07\x01\x00", b"\x04\x22\x4d\x18",
                                  b"!<arch>\n", b"MSCF\0\0\0\0", b"\xed\xab\xee\xdb")):
                  return "unsupported"
              # Text-like prefixes alone are not archive signatures. Require
              # bzip2's block/end marker, or cpio's first fixed-width hex field.
              if re.match(rb"BZh[1-9](1AY&SY|\x17rE8P\x90)|07070[12][0-9A-Fa-f]{8}", data):
                  return "unsupported"
              if len(data) >= 512:
                  block = data[:512]
                  try:
                      checksum = octal(block[148:156])
                      if checksum == sum(block[:148]) + 256 + sum(block[156:]):
                          if block[257:265] in (b"ustar\x0000", b"ustar  \x00"):
                              return "tar"
                          if block[257:265] == b"\0" * 8:
                              for start, end in ((100, 108), (108, 116), (116, 124), (124, 136), (136, 148)):
                                  octal(block[start:end])
                              return "tar"
                  except ValueError:
                      pass
              return ""

          def expand_tar(raw):
              expanded = io.BytesIO()
              remaining = MAX_STREAM
              decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
              pending = b""
              while True:
                  supplied = pending or raw.read(65536)
                  try:
                      chunk = decoder.decompress(supplied, min(65536, remaining + 1))
                  except zlib.error:
                      reject("", "unreadable or invalid archive gzip envelope")
                  pending = decoder.unconsumed_tail
                  remaining -= len(chunk)
                  if remaining < 0:
                      raise ValueError("expanded stream limit")
                  expanded.write(chunk)
                  if decoder.eof:
                      if decoder.unused_data or pending or raw.read(1):
                          reject("", "unreadable or invalid archive: trailing gzip data")
                      return expanded
                  if not supplied and not chunk:
                      reject("", "unreadable or invalid archive gzip envelope")

          def octal(value):
              head, _, tail = value.partition(b"\0")
              digits = head.strip(b" ")
              if any(c not in b"\0 " for c in tail) or any(c not in b"01234567" for c in digits):
                  raise ValueError("non-octal field")  # Includes all base-256 encodings.
              return int(digits or b"0", 8)

          def text_field(value):
              head, _, tail = value.partition(b"\0")
              if any(tail):
                  raise ValueError("nonzero string tail")
              return head

          def ustar_members(data):
              members = []
              pos = total = 0
              while pos + 512 <= len(data):
                  block = data[pos:pos + 512].tobytes()
                  if block == b"\0" * 512:
                      if len(data) - pos < 1024 or len(data) % 512 or any(data[pos:]):
                          reject("", "unreadable or invalid archive end records")
                      return members
                  if len(members) >= MAX_HEADERS:
                      reject("", "member count limit exceeded")
                  if block[156:157] != b"0":
                      reject("", "unsupported member type")
                  if block[257:265] != b"ustar\x0000":
                      reject("", "unreadable or invalid archive: POSIX ustar required")
                  try:
                      values = [octal(block[a:b]) for a, b in
                                ((100, 108), (108, 116), (116, 124), (124, 136),
                                 (136, 148), (148, 156), (329, 337), (337, 345))]
                      if values[5] != sum(block[:148]) + 256 + sum(block[156:]):
                          raise ValueError("checksum mismatch")
                      if any(block[157:257]) or any(block[500:]):
                          raise ValueError("nonzero spare bytes")
                      text_field(block[265:297])  # Owner/group are format metadata.
                      text_field(block[297:329])
                      name, prefix = text_field(block[:100]), text_field(block[345:500])
                  except ValueError:
                      reject("", "unreadable or invalid archive header field")
                  path = prefix + b"/" + name if prefix else name
                  parts = path.replace(b"\\", b"/").split(b"/")
                  if (not name or path.startswith((b"/", b"\\")) or b".." in parts or
                          re.match(rb"^[A-Za-z]:", path) or any(c < 32 or c == 127 for c in path)):
                      reject("", "unsafe member path")
                  size = values[3]
                  if size > MAX_MEMBER:
                      reject(os.fsdecode(path), "member size limit exceeded")
                  total += size
                  if total > MAX_TOTAL:
                      reject(os.fsdecode(path), "total size limit exceeded")
                  start, end = pos + 512, pos + 512 + size
                  pos = start + ((size + 511) // 512) * 512
                  if pos > len(data):
                      reject("", "unreadable or invalid archive payload")
                  if any(data[end:pos]):
                      reject("", "unreadable or invalid archive: nonzero padding")
                  members.append((path, start, end))
              reject("", "unreadable or invalid archive end records")

          def scan_terms(data, kind, name, words):
              options = "-oaiwF" if kind == "contents" else "-oiwF"
              for word in words:
                  result = subprocess.run(
                      [b"grep", options.encode(), b"--", word], input=data,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  )
                  if result.returncode not in (0, 1):
                      reject(name, "unable to scan archive member")
                  if result.returncode == 0:
                      event(kind, name, result.stdout.count(b"\n"))

          def scan(path, words):
              hint = suffix(path)
              try:
                  raw = open(path, "rb")
              except OSError:
                  if not hint:
                      return 3  # Preserve ordinary unreadable-file diagnostics.
                  raise
              with raw:
                  signature = magic(raw.read(512))
                  raw.seek(0)
                  if hint == "unsupported" or signature == "unsupported":
                      reject("", "unsupported archive format")
                  if not hint and not signature:
                      return 3  # Ordinary tracked files keep the shell scanner.
                  if signature != "gzip":
                      reject("", "unreadable or invalid archive: gzip ustar profile required")
                  expanded = expand_tar(raw)
                  scanned = skipped = 0
                  with expanded.getbuffer() as data:
                      for path, start, end in ustar_members(data):
                          name = os.fsdecode(path)  # Rendering only; detection uses raw bytes.
                          scan_terms(path, "path", name, words)
                          payload = data[start:end].tobytes()
                          if suffix(name) or magic(payload[:512]):
                              reject(name, "nested archive is not supported")
                          if b"\0" in payload:
                              event("skip", name)
                              skipped += 1
                          else:
                              scan_terms(payload, "contents", name, words)
                              scanned += 1
                  event("summary", str(scanned), skipped)
              return 0

          try:
              with open(sys.argv[2], "rb") as word_file:
                  words = word_file.read().split(b"\0")[:-1]
              status = scan(sys.argv[1], words)
          except Rejected:
              status = 1
          except Exception:
              # Never emit exception text: it can include unmasked paths/data.
              event("error", "", "unreadable or invalid archive")
              status = 1
          sys.exit(status)
          PY

          while IFS= read -r -d '' f; do
            archive_status=0
            python3 "$scan_dir/archive.py" "$f" "$scan_dir/words" >"$scan_dir/events" 2>/dev/null || archive_status=$?
            if [ "$archive_status" -ne 0 ] && [ "$archive_status" -ne 3 ]; then
              report "" "keyword guard: unable to scan archive or tracked contents of $f"
              fail=1
            fi
            while IFS= read -r -d '' kind && IFS= read -r -d '' member && IFS= read -r -d '' detail; do
              case "$kind" in
                contents|path)
                  report "" "$f: $member: prohibited word in archive member $kind ($detail occurrence(s))"
                  fail=1 ;;
                skip)
                  report_plain "keyword guard: $f: $member: skipped binary member" ;;
                error)
                  report "" "keyword guard: $f: $member: $detail"
                  fail=1 ;;
                summary)
                  report_plain "keyword guard: archive $f: scanned $member text member(s); skipped $detail binary member(s)" ;;
                *)
                  report "" "keyword guard: invalid archive scan result"
                  fail=1 ;;
              esac
            done <"$scan_dir/events"
            safe=$(mask_path "$f")
            for w in "${words[@]}"; do
              # -a: scan binary contents as text; -w: word boundaries;
              # -F: literal; -i: case-insensitive. grep status 1 means
              # ordinary no-match; every other failure is a scan failure.
              matches_file="$scan_dir/matches"
              hits=0
              if [ "$archive_status" -eq 3 ]; then
                if grep -oaiwF -- "$w" "$f" >"$matches_file" 2>/dev/null; then
                  hits=$(wc -l <"$matches_file")
                else
                  grep_status=$?
                  if [ "$grep_status" -ne 1 ]; then
                    report "" "keyword guard: unable to scan tracked contents"
                    fail=1
                  fi
                fi
                if [ "$hits" -gt 0 ]; then
                  if [ "$safe" = "$f" ]; then
                    report "$f" "prohibited word in contents ($hits occurrence(s))"
                  else
                    report "" "prohibited word in contents of $f ($hits occurrence(s))"
                  fi
                  fail=1
                fi
              fi

              path_file="$scan_dir/path"
              printf '%s' "$f" >"$path_file"
              if grep -oiwF -- "$w" "$path_file" >"$matches_file" 2>/dev/null; then
                phits=$(wc -l <"$matches_file")
              else
                grep_status=$?
                if [ "$grep_status" -eq 1 ]; then
                  phits=0
                else
                  report "" "keyword guard: unable to scan tracked path"
                  fail=1
                  phits=0
                fi
              fi
              if [ "$phits" -gt 0 ]; then
                report "" "prohibited word in path $f ($phits occurrence(s))"
                fail=1
              fi
            done
          done <"$tracked_file"

          if [ "$fail" -eq 0 ]; then
            report_plain "keyword guard: clean"
          fi
          exit $fail
