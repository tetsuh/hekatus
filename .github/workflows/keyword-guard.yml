name: keyword-guard

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every unlisted scope becomes `none`. Neither job writes
# to the repository, and neither needs the token after checkout.
permissions:
  contents: read

jobs:
  keyword-guard:
    runs-on: ubuntu-latest
    steps:
      # A fork pull request receives no repository secret, so the guard
      # cannot scan it. Fail loudly instead of passing unscanned. Reading a
      # contributor-controlled tree with `pull_request_target` — the usual
      # way to obtain the secret here — would expose a write-scoped token to
      # that tree, which is not a trade this repository accepts.
      - name: Reject unscannable fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot be scanned by the keyword guard."
          echo "Re-run the branch from a branch in this repository before merging."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Do not leave the token in the checked-out tree's git config.
          persist-credentials: false

      # Scans all tracked files (contents and paths) for prohibited words.
      # The word list comes from the KEYWORD_GUARD_WORDS secret
      # (comma-separated, matched case-insensitively on word boundaries)
      # and is never stored in this repository.
      #
      # Reporting never discloses the prohibited text itself: after a valid
      # list is parsed, every reporter message is masked, while contents hits
      # report the file and an occurrence count and paths are locatable.
      - name: Scan tracked files for prohibited words
        env:
          WORDS: ${{ secrets.KEYWORD_GUARD_WORDS }}
        run: |
          if [ -z "$WORDS" ]; then
            echo "::error::KEYWORD_GUARD_WORDS repository secret is not set; configure it before merging."
            exit 1
          fi

          words=()
          IFS=',' read -ra raw <<< "$WORDS"
          for w in "${raw[@]}"; do
            w="$(printf '%s' "$w" | tr -d '[:space:]')"
            [ -n "$w" ] && words+=("$w")
          done
          if [ "${#words[@]}" -eq 0 ]; then
            echo "::error::KEYWORD_GUARD_WORDS word list is empty after parsing; set the repository secret to a comma-separated list before merging."
            exit 1
          fi

          # GNU grep is the source of truth for case equivalence. Use the
          # same locale and literal fixed-string matching for detection and
          # masking, including Unicode equivalents such as final sigma and
          # long s. Never use Bash lowercasing here: it does not implement
          # grep's complete case mapping.
          export LC_ALL=C.UTF-8
          mask_text() {
            local text="$1" w match prefix output rest
            for w in "${words[@]}"; do
              output=""
              rest="$text"
              # grep -o may emit every match on one input line; sed selects
              # exactly one match so each iteration consumes actual input.
              while match=$(printf '%s' "$rest" | grep -oaiF -- "$w" | sed -n '1p'); do
                prefix="${rest%%"$match"*}"
                output+="${prefix}***"
                rest="${rest#*"$match"}"
              done
              text="$output$rest"
            done
            printf '%s' "$text"
          }

          mask_path() {
            mask_text "$1"
          }

          report() {
            printf '%s\n' "$(mask_text "$1")"
          }

          fail=0
          while IFS= read -r -d '' f; do
            safe=$(mask_path "$f")
            for w in "${words[@]}"; do
              # -a: scan binary contents as text; -w: word boundaries;
              # -F: literal; -i: case-insensitive.
              hits=$(grep -oaiwF -- "$w" "$f" 2>/dev/null | wc -l || :)
              if [ "$hits" -gt 0 ]; then
                if [ "$safe" = "$f" ]; then
                  report "::error file=$f::prohibited word in contents ($hits occurrence(s))"
                else
                  report "::error::prohibited word in contents of $safe ($hits occurrence(s))"
                fi
                fail=1
              fi
              phits=$(printf '%s' "$f" | grep -oiwF -- "$w" | wc -l || :)
              if [ "$phits" -gt 0 ]; then
                report "::error::prohibited word in path $safe ($phits occurrence(s))"
                fail=1
              fi
            done
          done < <(git ls-files -z)

          if [ "$fail" -eq 0 ]; then
            report "keyword guard: clean"
          fi
          exit $fail
